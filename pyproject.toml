[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tinker-config-lens"
version = "0.1.0"
description = "Paired-run comparison and inspection harness for Tinker evals"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# Pinned at versions verified in the instrument check (docs/verification.md).
# Do not upgrade to "fix" things without confirming first.
dependencies = [
    "tinker==0.30.3",
    "tinker-cookbook==0.5.7",
    "tml-renderers==0.1.0",
    "torch==2.14.0",
    "pydantic>=2.0,<3",
    # math500 grading (tinker-cookbook[math-rl] deps)
    "sympy==1.14.0",
    "pylatexenc==2.11",
    "math-verify==0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.9",
]

[project.scripts]
lens = "lens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
