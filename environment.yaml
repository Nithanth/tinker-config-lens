# Devin snapshot setup for tinker-config-lens.
# Unverified until the DRS blueprint build passes — verify after first push.
initialize:
  - run: |
      python -m pip install --upgrade pip
      python -m pip install -e ".[dev]"
maintenance:
  - run: |
      python -m pip install -e ".[dev]" >/dev/null 2>&1 || true
knowledge:
  - name: test
    contents: |
      python -m pytest -q
  - name: lint
    contents: |
      python -m ruff check src/
  - name: app
    contents: |
      cd web && npm install && npm run dev   # Next.js inspector, reads runs/
  - name: secrets-and-spend
    contents: |
      TINKER_API_KEY comes from the environment only (locally: source
      ~/.secrets/tinker.env). Never print, log, or commit it. No bulk sampling
      before the instrument check in docs/verification.md passes and an
      approved cost forecast. $25 planning stop; $100 absolute ceiling.
